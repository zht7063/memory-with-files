[package]
name = "mwf"
description = "MWF: a project-local wiki engine for coding agents"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
publish.workspace = true

# Only this crate ships; the workspace sets publish = false, which dist would otherwise skip (docs/decisions/0054-release-config.md).
[package.metadata.dist]
dist = true

[dependencies]
mwf-cli.workspace = true
mwf-hooks.workspace = true
mwf-lifecycle.workspace = true

[lints]
workspace = true

[dev-dependencies]
assert_cmd = "2.2.2"
insta = { version = "1.49.0", features = ["filters"] }
tempfile = "3.27.0"
