[package]
name = "mwf-store"
description = "MWF .mwf/ layout, atomic writes, file lock and page IO"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
mwf-domain.workspace = true
# 1.0.228, not 1.0.229+: serde_derive 1.0.229 uses syn 3 while divan and thiserror-impl use
# syn 2, and deny.toml rejects duplicate major versions.
serde = { version = "1.0.228", features = ["derive"] }
thiserror = "2"
toml = { version = "1.2.2", default-features = false, features = ["parse", "serde", "std"] }

[dev-dependencies]
tempfile = "3.27.0"

[lints]
workspace = true
