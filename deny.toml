# cargo-deny policy (docs/decisions/0042-dependency-policy.md, 0046-pre-p0-doc-fixes.md).
# Adding a license here requires amending ADR 0046 first.

[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"

[licenses]
version = 2
# The allow list is policy (ADR 0046), not a record of current dependencies.
unused-allowed-license = "allow"
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Unicode-3.0",
  "Zlib",
]

[bans]
multiple-versions = "deny"
wildcards = "deny"
# Workspace crates depend on each other by path.
allow-wildcard-paths = true
# Exceptions to multiple-versions go here, each with the reason:
skip = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
