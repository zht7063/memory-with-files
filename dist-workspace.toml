[workspace]
members = ["cargo:."]

# Release configuration for dist (docs/decisions/0022-release-with-dist.md, 0054-release-config.md).
# After editing, run `dist generate` and commit the regenerated .github/workflows/release.yml.
[dist]
# The dist version that generated release.yml
cargo-dist-version = "0.34.0"
# CI backends to support
ci = "github"
# Installers to generate for each app: GitHub Release archives plus a Homebrew formula (0004); no shell/npm installers (0054)
installers = ["homebrew"]
# A GitHub repo to push Homebrew formulas to; the release job pushes with the HOMEBREW_TAP_TOKEN secret
tap = "zht7063/homebrew-tap"
# Publish jobs to run in CI
publish-jobs = ["homebrew"]
# Target platforms to build apps for (0012; no Windows)
targets = ["aarch64-apple-darwin", "x86_64-apple-darwin", "aarch64-unknown-linux-musl", "x86_64-unknown-linux-musl"]
# Run `dist plan` on pull requests, without building
pr-run-mode = "plan"
